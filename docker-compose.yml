services:
  cinder-mcp:
    build: .
    container_name: cinder-mcp
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - CINDER_API_URL=http://host.docker.internal:8080
      - PORT=8080
      - FLY_APP_NAME=local
    extra_hosts:
      - "host.docker.internal:host-gateway"
